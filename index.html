<!doctype html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#0b0e14"><title>Тренировки — A/B/C</title><link rel="manifest" href="./manifest.webmanifest"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Тренировки"><meta name="application-name" content="Силовой дневник"><meta name="mobile-web-app-capable" content="yes"><link rel="apple-touch-icon" href="./icons/apple-touch-icon.png"><link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<style>
:root{color-scheme:dark;--bg:#0b0e14;--surface:#151a23;--surface2:#1c2430;--border:#293241;--text:#f2f5fc;--muted:#9ca9ba;--green:#50d49d;--blue:#85aaff;--red:#ff5e69;--amber:#eab970}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--blue);outline-offset:2px}header{position:sticky;top:0;background:rgba(11,14,20,.96);backdrop-filter:blur(14px);z-index:10;border-bottom:1px solid var(--border)}.brand{max-width:850px;margin:auto;padding:calc(15px + env(safe-area-inset-top, 0px)) 18px 6px;display:flex;justify-content:space-between;align-items:center}.brand strong{font-size:19px;letter-spacing:-.4px}.subtitle,.muted{color:var(--muted)}.subtitle{font-size:12px}.nav{max-width:850px;margin:auto;display:flex;overflow-x:auto;scrollbar-width:none;padding:6px 14px 12px;gap:7px}.nav::-webkit-scrollbar{display:none}.tab{position:relative;flex:none;border:1px solid transparent;color:var(--muted);background:transparent;border-radius:12px;padding:9px 13px;font-weight:700}.tab.active{color:var(--text);background:var(--surface2);border-color:var(--border)}.dot{position:absolute;background:var(--red);width:7px;height:7px;right:3px;top:3px;border-radius:50%;box-shadow:0 0 0 2px var(--bg)}main{max-width:850px;margin:auto;padding:23px 16px calc(90px + env(safe-area-inset-bottom, 0px))}.topline,.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.topline{margin-bottom:18px}h1{font-size:25px;letter-spacing:-.7px;margin:0}h2{font-size:18px;margin:0}h3{font-size:15px;margin:0}.card{border:1px solid var(--border);border-radius:18px;background:var(--surface);padding:17px;margin-bottom:13px}.progress{height:10px;border-radius:50px;background:#303a46;overflow:hidden;margin-top:13px}.progress-fill{height:100%;background:linear-gradient(90deg,#4ccc9b,#87e9bc);width:0;transition:width .55s cubic-bezier(.2,.8,.2,1);border-radius:50px}.percent{font-size:27px;font-weight:750;color:var(--green)}.ex{display:flex;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid #28303c}.ex:last-child{border-bottom:0;padding-bottom:0}.ex:first-child{padding-top:0}.ex-name{font-weight:650}.ex-meta{color:var(--muted);font-size:13px;margin-top:4px}.ex.completed .ex-name{color:var(--muted);text-decoration:line-through;text-decoration-color:#556474}.check{width:27px;height:27px;flex:none;border:2px solid #627186;border-radius:9px;display:grid;place-items:center;color:transparent;background:transparent;transition:background .25s,border-color .25s,transform .22s}.check.checked{background:var(--green);border-color:var(--green);color:#10271d;transform:scale(1.04)}.check svg{width:18px;stroke-width:3;opacity:0;transform:scale(.35);transition:opacity .2s,transform .25s}.check.checked svg{opacity:1;transform:scale(1)}.btn{border:1px solid var(--border);background:var(--surface2);color:var(--text);border-radius:11px;padding:9px 12px;font-weight:650}.btn.primary{background:var(--green);color:#092519;border-color:var(--green)}.btn.danger{color:#ff949b}.btn.small{font-size:12px;padding:6px 9px}.btn.icon{width:34px;height:34px;padding:0;font-size:22px}.pill{display:inline-flex;align-items:center;gap:7px;color:var(--muted);font-size:13px;cursor:pointer}.pill input{accent-color:var(--red);width:17px;height:17px}.badge{display:inline-block;background:#263548;color:#adc3e9;padding:3px 9px;border-radius:9px;font-size:12px}.arrow{color:var(--green);font-weight:900;font-size:15px;margin-left:4px}.section-head{display:flex;justify-content:space-between;align-items:center;margin:22px 0 10px}.item-card{padding:14px 16px}.item-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.current{font-weight:800;font-size:22px;white-space:nowrap}.chart{display:flex;gap:9px;align-items:end;overflow-x:auto;min-height:133px;padding:20px 3px 4px;margin:12px 0 6px;border-bottom:1px solid #3a4657}.chart-col{min-width:43px;flex:1;max-width:86px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:end}.chart-weight{font-size:11px;color:#cfdbef;white-space:nowrap;margin-bottom:5px}.bar{width:65%;min-height:5px;background:#5677b4;border-radius:6px 6px 0 0;transition:height .35s}.chart-col:last-child .bar{background:var(--green)}.chart-label{font-size:10px;color:var(--muted);margin-top:4px}.history{font-size:12px;color:var(--muted);margin:9px 0}.entry{display:inline-flex;gap:6px;align-items:center;background:#202a37;border:1px solid #334053;padding:4px 7px;border-radius:8px;margin:3px 5px 3px 0}.mini-x{border:0;background:none;color:#9ba9bb;padding:0 2px}.empty{border:1px dashed #3f4b5c;border-radius:15px;padding:23px;text-align:center;color:var(--muted)}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.field{display:flex;flex-direction:column;gap:5px;color:var(--muted);font-size:12px}.field input,.field select{width:100%;background:#0d121a;border:1px solid #354154;border-radius:9px;color:var(--text);padding:10px;min-width:0}.field.wide{grid-column:1/-1}.form-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:13px}.note{font-size:13px;color:var(--muted);line-height:1.6}.recommend{border-left:3px solid var(--green);padding-left:12px;margin-bottom:16px}.recommend:last-child{margin-bottom:0}.separator{border:0;border-top:1px solid var(--border);margin:20px 0}.tag{font-size:11px;color:var(--amber);background:#493922;padding:4px 8px;border-radius:7px}.footer-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}.sr{position:absolute;left:-9999px}@media(max-width:480px){.card{padding:14px}.topline{align-items:flex-start}.chart-col{min-width:37px}.ex{gap:10px}.ex-name{font-size:14px}.btn.small{padding:5px 8px}}
.today-toggle{border:1px solid var(--border);background:var(--surface2);padding:9px 11px;border-radius:13px;flex-shrink:0;touch-action:manipulation;color:var(--text)}.today-toggle.selected{border-color:var(--red);background:rgba(255,94,105,.1)}.today-indicator{display:inline-flex;align-items:center;justify-content:center;width:19px;height:19px;flex:none;border-radius:6px;border:2px solid var(--muted);font-size:13px;line-height:1;transition:background .2s,border-color .2s,transform .2s}.today-toggle.selected .today-indicator{background:var(--red);border-color:var(--red);color:#111;transform:scale(1.06)}</style></head><body><header><div class="brand"><div><strong>Силовой дневник</strong><div class="subtitle">A / B / C · прогрессия нагрузки</div></div><span class="badge" id="saveStatus">Локально сохранено</span></div><nav class="nav" id="nav" aria-label="Разделы"></nav></header><main id="app"></main><input id="importFile" class="sr" type="file" accept="application/json,.json"><script>
'use strict';
const KEY='gym-tracker-v1';const uid=()=>('id'+Date.now().toString(36)+Math.random().toString(36).slice(2,7));
const exercise=(id,name,sets,range,weightId=null)=>({id,name,sets,range,weightId});
function initial(){return {version:1,tab:'A',today:null,done:{A:[],B:[],C:[],star:[]},days:{A:[exercise('a1','Жим гантелей под углом',3,'6–8','incline'),exercise('a2','Жим стоя OHP',3,'6–8','ohp'),exercise('a3','Тяга верхнего блока / подтягивания',3,'8–12','lat'),exercise('a4','Махи в стороны',3,'12–15','laterals'),exercise('a5','Жим ногами',3,'8–10','legpress'),exercise('a6','Разгибания на трицепс',2,'10–12')],B:[exercise('b1','Подтягивания / верхний блок',3,'6–10','lat'),exercise('b2','Тяга в упоре (chest-supported)',3,'8–12'),exercise('b3','Румынская тяга',3,'8–10','rdl'),exercise('b4','Махи в стороны',3,'12–15','laterals'),exercise('b5','Face pull',3,'15–20'),exercise('b6','Сгибания на бицепс',3,'8–12')],C:[exercise('c1','Жим штанги лёжа',3,'6–8','bench'),exercise('c2','Жим гантелей под углом',3,'8–10','incline'),exercise('c3','Горизонтальная тяга',3,'8–12','row'),exercise('c4','Махи в стороны',3,'12–15','laterals'),exercise('c5','Разведение на заднюю дельту',3,'15–20','rear'),exercise('c6','Молотки',2,'10–12','hammer')],star:[]},groups:[{id:'shoulders',name:'Плечи',items:[{id:'ohp',name:'Передняя дельта · жим штанги вертикальный',records:[rec(25)]},{id:'seatedpress',name:'Передняя дельта · жим сидя',records:[rec(12),rec(24.5,10),rec(22.9,8)]},{id:'laterals',name:'Средняя дельта · махи гантелей',records:[rec(12,14),rec(14,12)]},{id:'rear',name:'Махи на заднюю дельту',records:[rec(12,14)]}]},{id:'legs',name:'Ноги',items:[{id:'legpress',name:'Жим ногами',records:[rec(80)]},{id:'rdl',name:'Румынская тяга',records:[rec(100,8)]}]},{id:'back',name:'Спина',items:[{id:'lat',name:'Тяга блока к груди',records:[rec(59)]},{id:'row',name:'Тяга блока горизонтальная',records:[rec(59,10),rec(66,10),rec(73,8)]}]},{id:'chest',name:'Грудь',items:[{id:'bench',name:'Жим штанги горизонтальный',records:[rec(60,2)]},{id:'machineflat',name:'Жим горизонтальный · свободный вес в тренажёре',records:[rec(69,'8–10'),rec(71.5,8)]},{id:'incline',name:'Жим на наклонной скамье',records:[rec(20,10),rec(22,8)]},{id:'seatedmachine',name:'Жим сидя в тренажёре',records:[rec(50,10,null,true),rec(59,8)]}]},{id:'biceps',name:'Бицепс',items:[{id:'hammer',name:'Молотки в кроссовере с верёвкой',records:[rec(20.3,14)]}]}]};}
function rec(weight,reps=null,date=null,up=false){return {id:uid(),weight,reps,date,up};}
let state;try{state=JSON.parse(localStorage.getItem(KEY))||initial();if(!state.days||!state.groups)throw 0;}catch{state=initial();}let modal=null;let previousProgress={A:0,B:0,C:0,star:0};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nice=n=>Number(n).toLocaleString('ru-RU',{maximumFractionDigits:2});
const flat=()=>state.groups.flatMap(g=>g.items);
const findExercise=id=>flat().find(x=>x.id===id);
const last=item=>item?.records?.[item.records.length-1];
const displayRecord=r=>r?`${nice(r.weight)} кг${r.reps!==null&&r.reps!==''?' × '+esc(r.reps):''}`:'Нет записей';
const navs=[['A','A'],['B','B'],['C','C'],['star','★'],['weights','Веса'],['recommendations','Рекомендации']];
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));document.getElementById('saveStatus').textContent='Локально сохранено';}catch{document.getElementById('saveStatus').textContent='Не удалось сохранить';}}
function render(){document.getElementById('nav').innerHTML=navs.map(([id,name])=>`<button class="tab ${state.tab===id?'active':''}" data-action="tab" data-id="${id}" aria-current="${state.tab===id?'page':'false'}">${name}${state.today===id?'<span class="dot" aria-label="Сегодня"></span>':''}</button>`).join('');document.getElementById('app').innerHTML=(modal?modalHtml():'')+(['A','B','C','star'].includes(state.tab)?dayPage(state.tab):state.tab==='weights'?weightsPage():recommendPage());if(['A','B','C','star'].includes(state.tab)){let id=state.tab,bar=document.querySelector('.progress-fill'),n=state.days[id].length,d=state.done[id]||[],target=n?Math.round(state.days[id].filter(e=>d.includes(e.id)).length/n*100):0;if(bar){bar.style.width=previousProgress[id]+'%';requestAnimationFrame(()=>{bar.style.width=target+'%'});}previousProgress[id]=target;}}
function dayPage(id){let es=state.days[id]||[],done=state.done[id]||[],n=es.filter(e=>done.includes(e.id)).length,p=es.length?Math.round(n/es.length*100):0;return `<div class="topline"><div><div class="subtitle">ПРОГРАММА ТРЕНИРОВКИ</div><h1>${id==='star'?'Выходной · руки':'День '+id}</h1></div><button type="button" class="pill today-toggle ${state.today===id?'selected':''}" data-action="today" data-id="${id}" role="checkbox" aria-checked="${state.today===id}" aria-label="Сегодняшняя тренировка"><span class="today-indicator" aria-hidden="true">${state.today===id?'✓':''}</span><span>Сегодняшняя</span></button></div><section class="card"><div class="row"><div><div class="muted">Прогресс тренировки</div><strong>${n} из ${es.length} упражнений</strong></div><div class="percent">${p}%</div></div><div class="progress" role="progressbar" aria-valuenow="${p}" aria-valuemin="0" aria-valuemax="100"><div class="progress-fill" style="width:${p}%"></div></div></section><section class="card">${es.length?es.map(e=>{let item=findExercise(e.weightId),r=last(item),checked=done.includes(e.id);return `<div class="ex ${checked?'completed':''}"><button class="check ${checked?'checked':''}" aria-label="${checked?'Снять отметку':'Отметить выполнение'}: ${esc(e.name)}" aria-pressed="${checked}" data-action="done" data-id="${e.id}" data-day="${id}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5L20 7"/></svg></button><div style="flex:1"><div class="ex-name">${esc(e.name)}</div><div class="ex-meta">${e.sets} × ${esc(e.range)} ${r?'· '+displayRecord(r)+(r.up?'<span class="arrow">↑</span>':''):''}</div></div><button class="btn small" data-action="editDayExercise" data-id="${e.id}" data-day="${id}">Изм.</button></div>`}).join(''):'<div class="empty">Пока нет упражнений. Добавьте первое.</div>'}</section><div class="footer-actions"><button class="btn primary" data-action="addDayExercise" data-day="${id}">+ Упражнение</button><button class="btn danger" data-action="reset" data-day="${id}">Сбросить прогресс</button></div><p class="note">Сброс очищает только отметки упражнений этого дня. Записи весов не затрагиваются.</p>`}
function weightsPage(){return `<div class="topline"><div><div class="subtitle">РУЧНОЙ ЖУРНАЛ</div><h1>Рабочие веса</h1></div><button class="btn primary" data-action="addGroup">+ Секция</button></div><p class="note">История независима от тренировок. Для новых записей указывайте дату, вес и повторения. Зелёная ↑ обозначает план увеличить вес в следующий раз.</p>${state.groups.map(g=>`<div class="section-head"><h2>${esc(g.name)} <span class="muted">${g.items.length}</span></h2><div class="row"><button class="btn small" data-action="addExercise" data-group="${g.id}">+ Упражнение</button><button class="btn small danger" data-action="deleteGroup" data-group="${g.id}" title="Удалить секцию">✕</button></div></div>${g.items.length?g.items.map(i=>exerciseCard(g,i)).join(''):'<div class="empty">Упражнений пока нет</div>'}`).join('')}`}
function exerciseCard(g,i){let r=last(i),max=Math.max(1,...i.records.map(x=>Number(x.weight)||0));return `<article class="card item-card"><div class="item-head"><div><h3>${esc(i.name)}</h3><div class="subtitle">${i.records.length} записей</div></div><div class="current">${r?nice(r.weight)+' кг':'—'}${r?.up?'<span class="arrow" title="Увеличить в следующий раз">↑</span>':''}</div></div>${i.records.length?`<div class="chart" role="img" aria-label="График изменения рабочего веса: ${esc(i.name)}">${i.records.map((x,j)=>`<div class="chart-col"><span class="chart-weight">${nice(x.weight)}</span><div class="bar" style="height:${Math.max(7,Math.round((Number(x.weight)||0)/max*86))}px"></div><div class="chart-label">${x.date?esc(x.date.slice(5)):('#'+(j+1))}</div></div>`).join('')}</div><div class="history">${i.records.map(x=>`<span class="entry">${x.date?esc(x.date)+' · ':''}${displayRecord(x)}${x.up?'<span class="arrow">↑</span>':''}<button class="mini-x" title="Изменить запись" data-action="editRecord" data-group="${g.id}" data-id="${i.id}" data-record="${x.id}">✎</button></span>`).join('')}</div>`:'<p class="note">История пока пуста.</p>'}<div class="footer-actions"><button class="btn small primary" data-action="addRecord" data-group="${g.id}" data-id="${i.id}">+ Запись</button><button class="btn small" data-action="editExercise" data-group="${g.id}" data-id="${i.id}">Изменить упражнение</button></div></article>`}
function recommendPage(){let suggestions=[];for(let group of state.groups)for(let item of group.items){let r=last(item);if(!r)continue;let occurrences=Object.entries(state.days).flatMap(([day,es])=>es.filter(e=>e.weightId===item.id).map(e=>({day,range:e.range})));let up=item.records.filter(x=>x.up);if(up.length&&up[up.length-1]===r)suggestions.push(`<div class="recommend"><strong>${esc(item.name)} <span class="arrow">↑</span></strong><div class="note">${displayRecord(r)}. Ты отметил намерение повысить вес на следующей тренировке.</div></div>`);if(occurrences.length&&r.reps!==null){let match=occurrences.filter(o=>/^\d+$/.test(String(r.reps))&&Number(r.reps)>=Number(o.range.split(/[–-]/).pop()));if(match.length)suggestions.push(`<div class="recommend"><strong>${esc(item.name)}</strong><div class="note">${displayRecord(r)} — достигнута верхняя граница диапазона ${match.map(o=>o.day==='star'?'★':o.day).join(', ')}. Если техника стабильна и все рабочие подходы соответствуют диапазону, можно рассмотреть небольшой шаг повышения.</div></div>`);}}return `<h1>Рекомендации</h1><p class="note">Подсказки основаны на ручной истории весов. Система не знает, выполнены ли все подходы с хорошей техникой и запасом повторений — проверяй это самостоятельно.</p><section class="card">${suggestions.length?suggestions.join(''):'<div class="empty">Пока нет сигналов повышения нагрузки. Добавляй записи в раздел «Веса» или помечай запись стрелкой ↑.</div>'}</section><section class="card"><h2>Принцип прогрессии</h2><p class="note">Работай в заданном диапазоне повторений. Когда все рабочие подходы выполняются на верхней границе с чистой техникой, увеличь вес на минимальный доступный шаг. После повышения допустимо вернуться к нижней границе диапазона. При ухудшении техники сначала закрепи текущую нагрузку.</p></section><section class="card"><h2>Данные и резервная копия</h2><p class="note">Изменения сохраняются в localStorage браузера и обычно переживают его закрытие и перезагрузку телефона. При удалении данных сайта или открытии HTML под другим адресом история может стать недоступна. Делай резервные копии.</p><div class="footer-actions"><button class="btn" data-action="export">Экспорт JSON</button><button class="btn" data-action="import">Импорт JSON</button></div></section>`}
function modalHtml(){const m=modal;let title='',body='';const inp=(name,label,value='',type='text',wide=false)=>`<label class="field ${wide?'wide':''}">${label}<input name="${name}" type="${type}" value="${esc(value)}" ${type==='number'?'step="any" min="0"':''}></label>`;if(m.type==='group'){title='Новая секция';body=inp('name','Название, например Спина','','text',true)}if(m.type==='exercise'){let i=m.item;title=i?'Редактировать упражнение':'Новое упражнение';body=inp('name','Название',i?.name||'','text',true)}if(m.type==='record'){let r=m.record;title=r?'Изменить запись':'Новая запись';body=inp('weight','Вес, кг',r?.weight??'','number')+inp('reps','Повторения (можно диапазон)',r?.reps??'')+inp('date','Дата',r?.date??new Date().toLocaleDateString('en-CA'),'date',true)+`<label class="pill"><input name="up" type="checkbox" ${r?.up?'checked':''}> ↑ Увеличить вес в следующий раз</label>`}if(m.type==='day'){let e=m.item;title=e?'Изменить упражнение в программе':'Добавить упражнение в программу';body=inp('name','Название',e?.name||'','text',true)+inp('sets','Подходы',e?.sets??3,'number')+inp('range','Повторения, например 8–12',e?.range||'8–12');body+=`<label class="field wide">Связать с историей весов<select name="weightId"><option value="">Не связывать</option>${state.groups.map(g=>`<optgroup label="${esc(g.name)}">${g.items.map(i=>`<option value="${i.id}" ${i.id===e?.weightId?'selected':''}>${esc(i.name)}</option>`).join('')}</optgroup>`).join('')}</select></label>`}return `<section class="card" style="border-color:var(--blue);margin-bottom:20px"><div class="row"><h2>${title}</h2><button class="btn small" data-action="close">✕</button></div><form id="editForm"><div class="form-grid" style="margin-top:14px">${body}</div><div class="form-actions"><button class="btn primary" type="submit">Сохранить</button><button class="btn" type="button" data-action="close">Отмена</button>${m.item||m.record?'<button class="btn danger" type="button" data-action="removeModal">Удалить</button>':''}</div></form></section>`}
function groupBy(id){return state.groups.find(g=>g.id===id)};function itemBy(m){return groupBy(m.group)?.items.find(i=>i.id===m.id)}
function update(){save();render()};
document.addEventListener('change',ev=>{let a=ev.target.dataset.action;if(a==='today'){state.today=ev.target.checked?ev.target.dataset.id:null;update();}});
document.addEventListener('click',ev=>{const el=ev.target.closest('[data-action]');if(!el)return;let a=el.dataset.action,id=el.dataset.id,day=el.dataset.day,g=el.dataset.group; if(a==='today'){state.today=state.today===id?null:id;update();return}if(a==='tab'){state.tab=id;modal=null;update();return}if(a==='done'){let d=state.done[day]||(state.done[day]=[]);state.done[day]=d.includes(id)?d.filter(x=>x!==id):[...d,id];update();return}if(a==='reset'){if(confirm('Сбросить выполненные упражнения дня '+(day==='star'?'★':day)+'?')){state.done[day]=[];update()}return}if(a==='addGroup')modal={type:'group'};if(a==='addExercise')modal={type:'exercise',group:g};if(a==='editExercise')modal={type:'exercise',group:g,id,item:groupBy(g).items.find(x=>x.id===id)};if(a==='addRecord')modal={type:'record',group:g,id};if(a==='editRecord')modal={type:'record',group:g,id,record:itemBy({group:g,id}).records.find(r=>r.id===el.dataset.record)};if(a==='addDayExercise')modal={type:'day',day};if(a==='editDayExercise')modal={type:'day',day,id,item:state.days[day].find(e=>e.id===id)};if(a==='close')modal=null;if(a==='deleteGroup'){let group=groupBy(g);if(confirm('Удалить секцию «'+group.name+'» и всю её историю?')){state.groups=state.groups.filter(x=>x.id!==g);update();return}}if(a==='removeModal'){if(!confirm('Удалить запись или упражнение?'))return;let m=modal;if(m.type==='record')itemBy(m).records=itemBy(m).records.filter(x=>x.id!==m.record.id);if(m.type==='exercise')groupBy(m.group).items=groupBy(m.group).items.filter(x=>x.id!==m.id);if(m.type==='day'){state.days[m.day]=state.days[m.day].filter(x=>x.id!==m.id);state.done[m.day]=state.done[m.day].filter(x=>x!==m.id)}modal=null;}if(a==='export'){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='gym-backup-'+new Date().toISOString().slice(0,10)+'.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);return}if(a==='import'){document.getElementById('importFile').click();return}update();});
document.addEventListener('submit',ev=>{if(ev.target.id!=='editForm')return;ev.preventDefault();let m=modal,f=new FormData(ev.target),name=String(f.get('name')||'').trim();if(m.type==='group'){if(!name)return alert('Введите название');state.groups.push({id:uid(),name,items:[]})}if(m.type==='exercise'){if(!name)return alert('Введите название');if(m.item)m.item.name=name;else groupBy(m.group).items.push({id:uid(),name,records:[]})}if(m.type==='record'){let w=Number(f.get('weight'));if(!f.get('weight')||!Number.isFinite(w)||w<=0)return alert('Укажите положительный вес');let s=String(f.get('reps')||'').trim();let data={weight:w,reps:s===''?null:s,date:String(f.get('date')||'')||null,up:f.has('up')};if(m.record)Object.assign(m.record,data);else itemBy(m).records.push({id:uid(),...data})}if(m.type==='day'){if(!name)return alert('Введите название');let s=Number(f.get('sets'));if(!Number.isInteger(s)||s<1)return alert('Подходы должны быть целым числом');let data={name,sets:s,range:String(f.get('range')||'').trim(),weightId:String(f.get('weightId')||'')||null};if(m.item)Object.assign(m.item,data);else state.days[m.day].push({id:uid(),...data})}modal=null;update();});
document.getElementById('importFile').addEventListener('change',async ev=>{let file=ev.target.files?.[0];if(!file)return;try{let d=JSON.parse(await file.text());if(!d.days||!d.groups||!d.done||!Array.isArray(d.groups))throw Error('Неверный формат');if(confirm('Заменить текущие данные импортированной копией?')){state=d;modal=null;update()}}catch(e){alert('Импорт не удался: '+e.message)}ev.target.value=''});
render();save();
if ('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost')) {
  window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js',{scope:'./'}).catch(err=>console.warn('Offline cache unavailable:',err)));
}
</script></body></html>
