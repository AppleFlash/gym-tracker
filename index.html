<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#0b0e14"><title>Тренировки — A/B/C</title><link rel="manifest" href="./manifest.webmanifest"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Тренировки"><meta name="application-name" content="Силовой дневник"><meta name="mobile-web-app-capable" content="yes"><link rel="apple-touch-icon" href="./icons/apple-touch-icon.png"><link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<style>
:root{color-scheme:dark;--bg:#0b0e14;--surface:#151a23;--surface2:#1c2430;--border:#293241;--text:#f2f5fc;--muted:#9ca9ba;--green:#50d49d;--blue:#85aaff;--red:#ff5e69;--amber:#eab970}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--blue);outline-offset:2px}header{position:sticky;top:0;background:rgba(11,14,20,.96);backdrop-filter:blur(14px);z-index:10;border-bottom:1px solid var(--border)}.brand{max-width:850px;margin:auto;padding:calc(15px + env(safe-area-inset-top, 0px)) 18px 6px;display:flex;justify-content:space-between;align-items:center}.brand strong{font-size:19px;letter-spacing:-.4px}.subtitle,.muted{color:var(--muted)}.subtitle{font-size:12px}.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;background:rgba(11,14,20,.96);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--border);padding:6px 4px calc(6px + env(safe-area-inset-bottom, 0px))}.tab{flex:1;max-width:160px;position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;color:var(--muted);font-size:11px;font-weight:650;padding:4px 0}.tab svg{width:24px;height:24px}.tab.active{color:var(--green)}.tab .dot{right:calc(50% - 17px);top:2px}.seg{display:flex;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:3px;margin-bottom:18px}.seg-btn{flex:1;position:relative;border:0;background:none;color:var(--muted);font-weight:700;padding:8px 0;border-radius:9px}.seg-btn.active{background:var(--surface2);color:var(--text)}body.chat-mode{overflow:hidden}.chat-page{position:fixed;left:0;right:0;top:var(--hh,80px);bottom:calc(var(--kb,0px) + var(--nh,64px));max-width:850px;margin:auto;display:flex;flex-direction:column;gap:8px;padding:10px 16px}.chat-page .chatlog{flex:1;max-height:none;margin:0}body.kb .nav{display:none}body.kb .chat-page{bottom:var(--kb,0px)}.dot{position:absolute;background:var(--red);width:7px;height:7px;right:3px;top:3px;border-radius:50%;box-shadow:0 0 0 2px var(--bg)}main{max-width:850px;margin:auto;padding:23px 16px calc(90px + env(safe-area-inset-bottom, 0px))}.topline,.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.topline{margin-bottom:18px}h1{font-size:25px;letter-spacing:-.7px;margin:0}h2{font-size:18px;margin:0}h3{font-size:15px;margin:0}.card{border:1px solid var(--border);border-radius:18px;background:var(--surface);padding:17px;margin-bottom:13px}.progress{height:10px;border-radius:50px;background:#303a46;overflow:hidden;margin-top:13px}.progress-fill{height:100%;background:linear-gradient(90deg,#4ccc9b,#87e9bc);width:0;transition:width .55s cubic-bezier(.2,.8,.2,1);border-radius:50px}.percent{font-size:27px;font-weight:750;color:var(--green)}.ex{display:flex;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid #28303c}.ex:last-child{border-bottom:0;margin-bottom:-14px}.ex:first-child{margin-top:-14px}.ex{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}.ex.dragging{position:relative;padding-left:10px;padding-right:10px;margin-left:-10px;margin-right:-10px;z-index:5;background:var(--surface2);border-radius:12px;box-shadow:0 12px 28px rgba(0,0,0,.45);transition:box-shadow .2s}.drag-handle{display:none;color:var(--muted);padding:6px 2px;cursor:grab;touch-action:none}.drag-handle:active{cursor:grabbing}@media(hover:hover) and (pointer:fine){.drag-handle{display:block}}.ex-name{font-weight:650}.ex-meta{color:var(--muted);font-size:13px;margin-top:4px}.ex.completed .ex-name{color:var(--muted);text-decoration:line-through;text-decoration-color:#556474}.check{width:27px;height:27px;padding:0;flex:none;border:2px solid #627186;border-radius:9px;display:grid;place-items:center;color:transparent;background:transparent;transition:background .25s,border-color .25s,transform .22s}.check.checked{background:var(--green);border-color:var(--green);color:#10271d;transform:scale(1.04)}.check svg{display:block;width:18px;height:18px;stroke-width:3;opacity:0;transform:scale(.35);transition:opacity .2s,transform .25s}.check.checked svg{opacity:1;transform:scale(1)}.btn{border:1px solid var(--border);background:var(--surface2);color:var(--text);border-radius:11px;padding:9px 12px;font-weight:650}.btn.primary{background:var(--green);color:#092519;border-color:var(--green)}.btn.danger{color:#ff949b}.btn.small{font-size:12px;padding:6px 9px}.btn.icon{width:34px;height:34px;padding:0;font-size:22px}.pill{display:inline-flex;align-items:center;gap:7px;color:var(--muted);font-size:13px;cursor:pointer}.pill input{accent-color:var(--red);width:17px;height:17px}.badge{display:inline-block;background:#263548;color:#adc3e9;padding:3px 9px;border-radius:9px;font-size:12px}.arrow{color:var(--green);font-weight:900;font-size:15px;margin-left:4px}.search{position:relative;margin:14px 0 4px}.search input{width:100%;background:#0d121a;border:1px solid #354154;border-radius:11px;color:var(--text);padding:11px 42px 11px 12px;font-size:16px;-webkit-appearance:none;appearance:none}.search input::-webkit-search-cancel-button{display:none}.search-x{position:absolute;right:7px;top:50%;transform:translateY(-50%);width:30px;height:30px;padding:0;border:0;border-radius:50%;background:#2a3442;color:var(--muted)}.search-x[hidden]{display:none}.section-head{display:flex;justify-content:space-between;align-items:center;margin:22px 0 10px}.item-card{padding:14px 16px}.item-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.current{font-weight:800;font-size:22px;white-space:nowrap}.chart{display:flex;gap:9px;align-items:end;overflow-x:auto;min-height:133px;padding:20px 3px 4px;margin:12px 0 6px;border-bottom:1px solid #3a4657}.chart-col{cursor:pointer;min-width:43px;flex:1;max-width:86px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:end}.chart-weight{font-size:11px;color:#cfdbef;white-space:nowrap;margin-bottom:5px}.bar{width:65%;min-height:5px;background:#5677b4;border-radius:6px 6px 0 0;transition:height .35s}.chart-col:last-child .bar{background:var(--green)}.chart-label{font-size:10px;color:var(--muted);margin-top:4px}dialog.modal{border:0;padding:0;background:transparent;color:inherit;width:min(520px,calc(100% - 32px));max-width:none;max-height:calc(100% - 32px);margin:auto;overflow:visible}dialog.modal .card{margin:0;border-color:var(--blue)}dialog.modal::backdrop{background:rgba(5,8,12,.65);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}dialog.modal[open]{animation:pop .2s ease-out}@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.97)}}.item-card .item-head[data-action]{cursor:pointer}.chev{display:inline-block;margin-left:8px;color:var(--muted);transition:transform .3s ease}.item-card.open .chev{transform:rotate(90deg)}.chart-wrap{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows .3s ease,opacity .3s ease}.chart-wrap>div{overflow:hidden;min-height:0}.item-card.open .chart-wrap{grid-template-rows:1fr;opacity:1}.rec-table{width:100%;border-collapse:collapse;font-size:13px;margin:12px 0 4px}.rec-table th{text-align:left;color:var(--muted);font-weight:600;font-size:11px;padding:6px 4px;border-bottom:1px solid #334053}.rec-table td{padding:9px 4px;border-bottom:1px solid #28303c}.rec-table tbody tr{cursor:pointer}.rec-table tbody tr:last-child td{border-bottom:0}.empty{border:1px dashed #3f4b5c;border-radius:15px;padding:23px;text-align:center;color:var(--muted)}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.field{display:flex;flex-direction:column;justify-content:flex-end;gap:5px;color:var(--muted);font-size:12px}.field input,.field select{width:100%;background:#0d121a;border:1px solid #354154;border-radius:9px;color:var(--text);padding:10px;min-width:0}.field input[type=date]{-webkit-appearance:none;appearance:none;min-height:42px}.field input::-webkit-date-and-time-value{text-align:left}.field.wide{grid-column:1/-1}.form-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:13px}.note{font-size:13px;color:var(--muted);line-height:1.6}.chatlog{max-height:55vh;overflow-y:auto;display:flex;flex-direction:column;gap:8px;margin:10px 0}.msg{padding:9px 12px;border-radius:13px;font-size:14px;line-height:1.5;max-width:88%;overflow-wrap:anywhere}.msg.user{align-self:flex-end;background:#2b4a3d}.msg.model{align-self:flex-start;background:var(--surface2);border:1px solid var(--border)}.msg.typing{color:var(--muted)}.profile{margin:6px 0 4px}.profile summary{cursor:pointer;color:var(--muted);font-size:13px;padding:4px 0}.profile textarea{display:block;width:100%;margin-top:6px;resize:vertical;background:#0d121a;border:1px solid #354154;border-radius:11px;color:var(--text);padding:10px;font:inherit;font-size:16px;line-height:1.4}.chat-box{border:1px solid #354154;border-radius:14px;background:#0d121a;padding:8px}.chat-box textarea{display:block;width:100%;resize:none;border:0;outline:0;background:transparent;color:var(--text);font:inherit;font-size:16px;line-height:1.4;padding:4px;max-height:calc(14em + 8px);overflow-y:auto}.chat-bar{display:flex;justify-content:space-between;align-items:center;margin-top:6px}.chat-bar select{background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:9px;padding:6px 8px;font-size:13px}.msg-meta{font-size:10px;color:var(--muted);margin-top:4px}.rules{margin:10px 0 0;padding-left:20px;font-size:14px;line-height:1.55;color:var(--text)}.rules li{margin-bottom:9px}.rules li:last-child{margin-bottom:0}.rules strong{color:var(--green)}.separator{border:0;border-top:1px solid var(--border);margin:20px 0}.tag{font-size:11px;color:var(--amber);background:#493922;padding:4px 8px;border-radius:7px}.footer-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}.sr{position:absolute;left:-9999px}@media(max-width:480px){.card{padding:14px}.topline{align-items:flex-start}.chart-col{min-width:37px}.ex{gap:10px}.ex-name{font-size:14px}.btn.small{padding:5px 8px}}
.today-toggle{border:1px solid var(--border);background:var(--surface2);padding:9px 11px;border-radius:13px;flex-shrink:0;touch-action:manipulation;color:var(--text)}.today-toggle.selected{border-color:var(--red);background:rgba(255,94,105,.1)}.today-indicator{display:inline-flex;align-items:center;justify-content:center;width:19px;height:19px;flex:none;border-radius:6px;border:2px solid var(--muted);font-size:13px;line-height:1;transition:background .2s,border-color .2s,transform .2s}.today-toggle.selected .today-indicator{background:var(--red);border-color:var(--red);color:#111;transform:scale(1.06)}</style></head><body><header><div class="brand"><div><strong>Силовой дневник</strong><div class="subtitle">A / B / C · прогрессия нагрузки</div></div><span class="badge" id="saveStatus">Локально сохранено</span></div></header><main id="app"></main><nav class="nav" id="nav" aria-label="Разделы"></nav><input id="importFile" class="sr" type="file" accept="application/json,.json"><script>
'use strict';
const KEY='gym-tracker-v1';const uid=()=>('id'+Date.now().toString(36)+Math.random().toString(36).slice(2,7));
const exercise=(id,name,sets,range,weightId=null)=>({id,name,sets,range,weightId});
function initial(){return {version:1,tab:'A',today:null,done:{A:[],B:[],C:[],star:[]},days:{A:[exercise('a1','Жим гантелей под углом',3,'6–8','incline'),exercise('a2','Жим стоя OHP',3,'6–8','ohp'),exercise('a3','Тяга верхнего блока / подтягивания',3,'8–12','lat'),exercise('a4','Махи в стороны',3,'12–15','laterals'),exercise('a5','Жим ногами',3,'8–10','legpress'),exercise('a6','Разгибания на трицепс',2,'10–12')],B:[exercise('b1','Подтягивания / верхний блок',3,'6–10','lat'),exercise('b2','Тяга в упоре (chest-supported)',3,'8–12'),exercise('b3','Румынская тяга',3,'8–10','rdl'),exercise('b4','Махи в стороны',3,'12–15','laterals'),exercise('b5','Face pull',3,'15–20'),exercise('b6','Сгибания на бицепс',3,'8–12')],C:[exercise('c1','Жим штанги лёжа',3,'6–8','bench'),exercise('c2','Жим гантелей под углом',3,'8–10','incline'),exercise('c3','Горизонтальная тяга',3,'8–12','row'),exercise('c4','Махи в стороны',3,'12–15','laterals'),exercise('c5','Разведение на заднюю дельту',3,'15–20','rear'),exercise('c6','Молотки',2,'10–12','hammer')],star:[]},groups:[{id:'shoulders',name:'Плечи',items:[{id:'ohp',name:'Передняя дельта · жим штанги вертикальный',records:[rec(25)]},{id:'seatedpress',name:'Передняя дельта · жим сидя',records:[rec(12),rec(24.5,10),rec(22.9,8)]},{id:'laterals',name:'Средняя дельта · махи гантелей',records:[rec(12,14),rec(14,12)]},{id:'rear',name:'Махи на заднюю дельту',records:[rec(12,14)]}]},{id:'legs',name:'Ноги',items:[{id:'legpress',name:'Жим ногами',records:[rec(80)]},{id:'rdl',name:'Румынская тяга',records:[rec(100,8)]}]},{id:'back',name:'Спина',items:[{id:'lat',name:'Тяга блока к груди',records:[rec(59)]},{id:'row',name:'Тяга блока горизонтальная',records:[rec(59,10),rec(66,10),rec(73,8)]}]},{id:'chest',name:'Грудь',items:[{id:'bench',name:'Жим штанги горизонтальный',records:[rec(60,2)]},{id:'machineflat',name:'Жим горизонтальный · свободный вес в тренажёре',records:[rec(69,'8–10'),rec(71.5,8)]},{id:'incline',name:'Жим на наклонной скамье',records:[rec(20,10),rec(22,8)]},{id:'seatedmachine',name:'Жим сидя в тренажёре',records:[rec(50,10,null,true),rec(59,8)]}]},{id:'biceps',name:'Бицепс',items:[{id:'hammer',name:'Молотки в кроссовере с верёвкой',records:[rec(20.3,14)]}]}]};}
function rec(weight,reps=null,date=null,up=false){return {id:uid(),weight,reps,date,up};}
let state;try{state=JSON.parse(localStorage.getItem(KEY))||initial();if(!state.days||!state.groups)throw 0;}catch{state=initial();}let modal=null;let previousProgress={A:0,B:0,C:0,star:0};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nice=n=>Number(n).toLocaleString('ru-RU',{maximumFractionDigits:2});
const flat=()=>state.groups.flatMap(g=>g.items);
const findExercise=id=>flat().find(x=>x.id===id);
const last=item=>item?.records?.[item.records.length-1];
const displayRecord=r=>r?`${nice(r.weight)} кг${r.reps!==null&&r.reps!==''?' × '+esc(r.reps):''}`:'Нет записей';
const DAYS=['A','B','C','star'];
const navs=[['day','Тренировки','<path d="M6.5 6.5v11M17.5 6.5v11M3 9v6M21 9v6M6.5 12h11"/>'],['weights','Веса','<path d="M4 19V10M10 19V5M16 19v-7M22 19H2"/>'],['chat','Чат','<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/>'],['recommendations','Советы','<path d="M9 5h11M9 12h11M9 19h11M4 5h.01M4 12h.01M4 19h.01"/>']];
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));document.getElementById('saveStatus').textContent='Локально сохранено';}catch{document.getElementById('saveStatus').textContent='Не удалось сохранить';}}
const openCharts=new Set();
function render(){let isDay=DAYS.includes(state.tab);document.getElementById('nav').innerHTML=navs.map(([id,name,icon])=>{let on=id==='day'?isDay:state.tab===id;return `<button class="tab ${on?'active':''}" data-action="tab" data-id="${id}" aria-current="${on?'page':'false'}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icon}</svg>${name}${id==='day'&&state.today&&!isDay?'<span class="dot" aria-label="Есть тренировка на сегодня"></span>':''}</button>`}).join('');document.body.classList.toggle('chat-mode',state.tab==='chat');document.getElementById('app').innerHTML=(modal?modalHtml():'')+(['A','B','C','star'].includes(state.tab)?dayPage(state.tab):state.tab==='weights'?weightsPage():state.tab==='chat'?chatPage():recommendPage());if(state.tab==='chat'){document.documentElement.style.setProperty('--hh',document.querySelector('header').offsetHeight+'px');document.documentElement.style.setProperty('--nh',document.getElementById('nav').offsetHeight+'px');drawChat()}let dl=document.querySelector('dialog.modal');if(dl)dl.showModal();if(['A','B','C','star'].includes(state.tab)){let id=state.tab,bar=document.querySelector('.progress-fill'),n=state.days[id].length,d=state.done[id]||[],target=n?Math.round(state.days[id].filter(e=>d.includes(e.id)).length/n*100):0;if(bar){bar.style.width=previousProgress[id]+'%';requestAnimationFrame(()=>{bar.style.width=target+'%'});}previousProgress[id]=target;}}
function dayPage(id){let es=state.days[id]||[],done=state.done[id]||[],n=es.filter(e=>done.includes(e.id)).length,p=es.length?Math.round(n/es.length*100):0;return `<div class="seg" role="tablist">${DAYS.map(d=>`<button class="seg-btn ${d===id?'active':''}" role="tab" aria-selected="${d===id}" data-action="tab" data-id="${d}">${d==='star'?'★':d}${state.today===d?'<span class="dot" aria-label="Сегодня"></span>':''}</button>`).join('')}</div><div class="topline"><div><div class="subtitle">ПРОГРАММА ТРЕНИРОВКИ</div><h1>${id==='star'?'Выходной · руки':'День '+id}</h1></div><button type="button" class="pill today-toggle ${state.today===id?'selected':''}" data-action="today" data-id="${id}" role="checkbox" aria-checked="${state.today===id}" aria-label="Сегодняшняя тренировка"><span class="today-indicator" aria-hidden="true">${state.today===id?'✓':''}</span><span>Сегодняшняя</span></button></div><section class="card"><div class="row"><div><div class="muted">Прогресс тренировки</div><strong>${n} из ${es.length} упражнений</strong></div><div class="percent">${p}%</div></div><div class="progress" role="progressbar" aria-valuenow="${p}" aria-valuemin="0" aria-valuemax="100"><div class="progress-fill" style="width:${p}%"></div></div></section><section class="card">${es.length?es.map(e=>{let item=findExercise(e.weightId),r=last(item),checked=done.includes(e.id);return `<div class="ex ${checked?'completed':''}" data-id="${e.id}" data-day="${id}"><button class="check ${checked?'checked':''}" aria-label="${checked?'Снять отметку':'Отметить выполнение'}: ${esc(e.name)}" aria-pressed="${checked}" data-action="done" data-id="${e.id}" data-day="${id}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M6 11.5l4 4 8-8"/></svg></button><div style="flex:1"><div class="ex-name">${esc(e.name)}</div><div class="ex-meta">${e.sets} × ${esc(e.range)} ${r?'· '+displayRecord(r)+(r.up?'<span class="arrow">↑</span>':''):''}</div></div><button class="btn small" data-action="editDayExercise" data-id="${e.id}" data-day="${id}">Изм.</button><span class="drag-handle" title="Перетащить" aria-hidden="true"><svg viewBox="0 0 10 16" width="10" height="16" fill="currentColor"><circle cx="2" cy="2" r="1.6"/><circle cx="8" cy="2" r="1.6"/><circle cx="2" cy="8" r="1.6"/><circle cx="8" cy="8" r="1.6"/><circle cx="2" cy="14" r="1.6"/><circle cx="8" cy="14" r="1.6"/></svg></span></div>`}).join(''):'<div class="empty">Пока нет упражнений. Добавьте первое.</div>'}</section><div class="footer-actions"><button class="btn primary" data-action="addDayExercise" data-day="${id}">+ Упражнение</button><button class="btn danger" data-action="reset" data-day="${id}">Сбросить прогресс</button></div><p class="note">Сброс очищает только отметки упражнений этого дня. Записи весов не затрагиваются.</p>`}
function weightsPage(){return `<div class="topline"><div><div class="subtitle">РУЧНОЙ ЖУРНАЛ</div><h1>Рабочие веса</h1></div><button class="btn primary" data-action="addGroup">+ Секция</button></div><div class="search"><input type="search" id="wsearch" placeholder="Поиск по секциям и упражнениям" value="${esc(wq)}" autocomplete="off" aria-label="Поиск"><button type="button" class="search-x" data-action="clearSearch" aria-label="Очистить поиск" ${wq?'':'hidden'}>✕</button></div><div id="wlist">${groupsHtml()}</div>`}
let wq='',wt;

function exerciseCard(g,i){let r=last(i),max=Math.max(1,...i.records.map(x=>Number(x.weight)||0));return `<article class="card item-card ${openCharts.has(i.id)?'open':''}"><div class="item-head" ${i.records.length?`data-action="toggleChart" data-id="${i.id}" role="button" tabindex="0" aria-expanded="${openCharts.has(i.id)}"`:''}><div><h3>${esc(i.name)}</h3><div class="subtitle">${i.records.length} записей</div></div><div class="current">${r?nice(r.weight)+' кг':'—'}${r?.up?'<span class="arrow" title="Увеличить в следующий раз">↑</span>':''}${i.records.length?'<span class="chev" aria-hidden="true">›</span>':''}</div></div>${i.records.length?`<div class="chart-wrap"><div><div class="chart" role="img" aria-label="График изменения рабочего веса: ${esc(i.name)}">${i.records.map((x,j)=>`<div class="chart-col" title="Изменить или удалить запись" data-action="editRecord" data-group="${g.id}" data-id="${i.id}" data-record="${x.id}"><span class="chart-weight">${nice(x.weight)}</span><div class="bar" style="height:${Math.max(7,Math.round((Number(x.weight)||0)/max*86))}px"></div><div class="chart-label">${x.date?esc(x.date.slice(5)):('#'+(j+1))}</div></div>`).join('')}</div></div></div><table class="rec-table"><thead><tr><th>Дата</th><th>Вес</th><th>Повторения</th></tr></thead><tbody>${i.records.map((x,j)=>`<tr data-action="editRecord" data-group="${g.id}" data-id="${i.id}" data-record="${x.id}" role="button" tabindex="0" title="Изменить или удалить запись"><td>${x.date?esc(x.date):'#'+(j+1)}</td><td>${nice(x.weight)} кг${x.up?' <span class="arrow">↑</span>':''}</td><td>${x.reps!==null&&x.reps!==''?esc(x.reps):'—'}</td></tr>`).join('')}</tbody></table>`:'<p class="note">История пока пуста.</p>'}<div class="footer-actions"><button class="btn small primary" data-action="addRecord" data-group="${g.id}" data-id="${i.id}">+ Запись</button><button class="btn small" data-action="editExercise" data-group="${g.id}" data-id="${i.id}">Изменить упражнение</button></div></article>`}
const AI_URL='https://gym-ai.sedinkin1993.workers.dev';let chat=[],chatBusy=false;const ai=()=>state.ai||(state.ai={model:'lite',profile:''});
const md=t=>esc(t).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/^[*-] /gm,'• ').replace(/\n/g,'<br>');

function aiContext(){let days=Object.entries(state.days).map(([d,es])=>`День ${d==='star'?'★':d}: `+es.map(e=>`${e.name} ${e.sets}×${e.range}`).join('; ')).join('\n'),hist=state.groups.map(g=>g.name+':\n'+g.items.map(i=>`- ${i.name}: `+(i.records.map(r=>`${r.date||'без даты'} ${r.weight} кг${r.reps?' × '+r.reps:''}${r.up?' (план ↑)':''}`).join(', ')||'нет записей')).join('\n')).join('\n');return `Ты — персональный тренер по силовым тренировкам. Цель пользователя — стабильно увеличивать рабочие веса, набирать мышечную массу и строить эстетичную фигуру.

Правила:
1. Только чтение. Ты не можешь добавлять, менять или удалять данные в приложении. Если просят изменить программу или записи — скажи, что именно поменять, и напомни, что это делается вручную.
2. Опирайся на данные ниже: программу по дням (упражнения, подходы, диапазоны повторений) и историю рабочих весов. Называй конкретные упражнения и цифры. Не выдумывай данные; если их мало для вывода — так и скажи.
3. Учитывай профиль пользователя и правила прогрессии. Профиль важнее общих советов.
4. Формат: по-русски, кратко. Сначала вывод, затем 2–5 пунктов с обоснованием или конкретными действиями. Не более 100 слов. Если пользователь просит подробный разбор (программы, всей истории) — до 250 слов.
5. Темы: тренировки, техника, прогрессия, восстановление, питание в контексте тренировок. На другие темы вежливо откажись.
6. Если пользователь говорит о боли или травме — посоветуй прекратить упражнение и обратиться к врачу, не ставь диагнозов.

Сегодня: ${new Date().toLocaleDateString('ru-RU')}

Профиль пользователя:
${ai().profile.trim()||'не заполнен'}

Программа:
${days}

История рабочих весов:
${hist}

Правила прогрессии:
${RULES.replace(/<\/li>/g,'\n').replace(/<[^>]+>/g,'').trim()}`}
async function askAI(q){let u={role:'user',text:q};chat.push(u);chatBusy=true;drawChat();try{let r=await fetch(AI_URL+'?model='+ai().model,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({systemInstruction:{parts:[{text:aiContext()}]},contents:chat.filter(m=>!m.err).map(m=>({role:m.role,parts:[{text:m.text}]}))})}),d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error?.message||'HTTP '+r.status);chat.push({role:'model',text:d.candidates?.[0]?.content?.parts?.map(p=>p.text).join('')||'Пустой ответ',model:d.modelVersion})}catch(e){u.err=true;chat.push({role:'model',text:'Ошибка: '+e.message,err:true})}chatBusy=false;drawChat()}
const RULES='<ol class="rules"><li><strong>Двойная прогрессия.</strong> Сначала добавляй повторения в рамках диапазона, потом вес.</li><li><strong>Когда повышать.</strong> Все рабочие подходы выполнены на верхней границе диапазона с чистой техникой — в следующий раз увеличь вес. Отметь запись стрелкой ↑, чтобы не забыть.</li><li><strong>На сколько.</strong> Минимальный шаг: +1–2,5 кг на верхнюю часть тела и изоляцию, +2,5–5 кг на ноги и базовые упражнения.</li><li><strong>После повышения.</strong> Нормально вернуться к нижней границе диапазона и снова дорасти до верхней.</li><li><strong>Запас повторений.</strong> Заканчивай подход, оставляя 1–2 повторения в запасе. Отказ — редко и только в последнем подходе.</li><li><strong>Техника важнее веса.</strong> Если техника ломается или не добираешь нижнюю границу, оставь вес и закрепи нагрузку.</li><li><strong>Застой.</strong> Вес не растёт 2–3 тренировки подряд — снизь его на 10% и снова дорасти. Проверь сон, питание и восстановление.</li></ol>';
function chatPage(){return `<div class="chat-page"><details class="profile"><summary>Обо мне и цели</summary><textarea id="aiProfile" rows="4" placeholder="Возраст, рост, вес, опыт, цели, ограничения, травмы…">${esc(ai().profile)}</textarea></details><div id="chatlog" class="chatlog">${chatHtml()}</div><form id="chatForm" class="chat-box"><textarea name="q" rows="1" placeholder="Вопрос о тренировках…" aria-label="Вопрос"></textarea><div class="chat-bar"><select id="aiModel" aria-label="Модель">${[['lite','Flash-Lite'],['flash','Flash']].map(([v,n])=>`<option value="${v}" ${ai().model===v?'selected':''}>${n}</option>`).join('')}</select><button class="btn primary small" id="chatSend" aria-label="Отправить" ${chatBusy?'disabled':''}>→</button></div></form></div>`}
function recommendPage(){return `<h1>Советы</h1><section class="card"><h2>Правила прогрессии</h2>${RULES}</section><section class="card"><h2>Данные и резервная копия</h2><p class="note">Изменения сохраняются в localStorage браузера и обычно переживают его закрытие и перезагрузку телефона. При удалении данных сайта или открытии HTML под другим адресом история может стать недоступна. Делай резервные копии.</p><div class="footer-actions"><button class="btn" data-action="export">Экспорт JSON</button><button class="btn" data-action="import">Импорт JSON</button></div></section>`}
function modalHtml(){const m=modal;let title='',body='';const inp=(name,label,value='',type='text',wide=false)=>`<label class="field ${wide?'wide':''}">${label}<input name="${name}" type="${type}" value="${esc(value)}" ${type==='number'?'step="any" min="0"':''}></label>`;if(m.type==='group'){title='Новая секция';body=inp('name','Название, например Спина','','text',true)}if(m.type==='exercise'){let i=m.item;title=i?'Редактировать упражнение':'Новое упражнение';body=inp('name','Название',i?.name||'','text',true)}if(m.type==='record'){let r=m.record;title=r?'Изменить запись':'Новая запись';body=inp('weight','Вес, кг',r?.weight??'','number')+inp('reps','Повторения (можно диапазон)',r?.reps??'')+inp('date','Дата',r?.date??new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10),'date',true)+`<label class="pill"><input name="up" type="checkbox" ${r?.up?'checked':''}> ↑ Увеличить вес в следующий раз</label>`}if(m.type==='day'){let e=m.item;title=e?'Изменить упражнение в программе':'Добавить упражнение в программу';body=inp('name','Название',e?.name||'','text',true)+inp('sets','Подходы',e?.sets??3,'number')+inp('range','Повторения, например 8–12',e?.range||'8–12');body+=`<label class="field wide">Связать с историей весов<select name="weightId"><option value="">Не связывать</option>${state.groups.map(g=>`<optgroup label="${esc(g.name)}">${g.items.map(i=>`<option value="${i.id}" ${i.id===e?.weightId?'selected':''}>${esc(i.name)}</option>`).join('')}</optgroup>`).join('')}</select></label>`}return `<dialog class="modal"><section class="card"><div class="row"><h2>${title}</h2><button class="btn small" data-action="close">✕</button></div><form id="editForm"><div class="form-grid" style="margin-top:14px">${body}</div><div class="form-actions"><button class="btn primary" type="submit">Сохранить</button><button class="btn" type="button" data-action="close">Отмена</button>${m.item||m.record?'<button class="btn danger" type="button" data-action="removeModal">Удалить</button>':''}</div></form></section></dialog>`}
function groupBy(id){return state.groups.find(g=>g.id===id)};function itemBy(m){return groupBy(m.group)?.items.find(i=>i.id===m.id)}

let drag=null;
function startDrag(row,y){let list=[...row.parentNode.querySelectorAll('.ex[data-id]')],i=list.indexOf(row);drag={row,list,i,j:i,y0:y,rects:list.map(r=>r.getBoundingClientRect())};row.classList.add('dragging');row.style.transform='scale(1.02)';list.forEach(r=>{if(r!==row)r.style.transition='transform .2s'});navigator.vibrate?.(10)}
document.addEventListener('pointerdown',ev=>{let row=ev.target.closest('.ex[data-id]');if(!row||drag||ev.button)return;if(ev.pointerType==='mouse'){if(ev.target.closest('.drag-handle')){ev.preventDefault();startDrag(row,ev.clientY)}return}let x=ev.clientX,y=ev.clientY,ns=['pointermove','pointerup','pointercancel'],off=()=>ns.forEach(n=>removeEventListener(n,cancel)),cancel=e=>{if(e.type!=='pointermove'||Math.hypot(e.clientX-x,e.clientY-y)>8){clearTimeout(t);off()}},t=setTimeout(()=>{off();startDrag(row,y)},350);ns.forEach(n=>addEventListener(n,cancel))});
document.addEventListener('pointermove',ev=>{if(!drag)return;let {row,list,i,rects}=drag,dy=ev.clientY-drag.y0,c=rects[i].top+rects[i].height/2+dy,j=i,h=rects[i].height;row.style.transform=`translateY(${dy}px) scale(1.02)`;rects.forEach((r,k)=>{let m=r.top+r.height/2;if(k>i&&m<c)j++;if(k<i&&m>c)j--});drag.j=j;list.forEach((r,k)=>{if(k!==i)r.style.transform=k>i&&k<=j?`translateY(${-h}px)`:k<i&&k>=j?`translateY(${h}px)`:''})});
function endDrag(){if(!drag)return;let {row,i,j,rects}=drag,day=row.dataset.day,dy=j>i?rects[j].bottom-rects[i].bottom:j<i?rects[j].top-rects[i].top:0,eat=e=>{e.preventDefault();e.stopPropagation()};drag=null;row.style.transition='transform .18s';row.style.transform=`translateY(${dy}px)`;addEventListener('click',eat,true);setTimeout(()=>{removeEventListener('click',eat,true);if(j!==i){let a=state.days[day];a.splice(j,0,a.splice(i,1)[0])}update()},180)}

document.addEventListener('change',ev=>{let a=ev.target.dataset.action;if(a==='today'){state.today=ev.target.checked?ev.target.dataset.id:null;update();}});
document.addEventListener('click',ev=>{if(ev.target.matches('dialog.modal')){modal=null;update();return}const el=ev.target.closest('[data-action]');if(!el)return;let a=el.dataset.action,id=el.dataset.id,day=el.dataset.day,g=el.dataset.group; if(a==='clearSearch'){let inp=document.getElementById('wsearch');clearTimeout(wt);wq='';inp.value='';el.hidden=true;document.getElementById('wlist').innerHTML=groupsHtml();inp.focus();return}if(a==='toggleChart'){openCharts.has(id)?openCharts.delete(id):openCharts.add(id);el.closest('.item-card').classList.toggle('open',openCharts.has(id));el.setAttribute('aria-expanded',openCharts.has(id));return}if(a==='today'){state.today=state.today===id?null:id;update();return}if(a==='tab'){if(id==='day')id=DAYS.includes(state.tab)?state.tab:state.today||state.lastDay||'A';if(DAYS.includes(id))state.lastDay=id;state.tab=id;modal=null;update();return}if(a==='done'){let d=state.done[day]||(state.done[day]=[]);state.done[day]=d.includes(id)?d.filter(x=>x!==id):[...d,id];update();return}if(a==='reset'){if(confirm('Сбросить выполненные упражнения дня '+(day==='star'?'★':day)+'?')){state.done[day]=[];update()}return}if(a==='addGroup')modal={type:'group'};if(a==='addExercise')modal={type:'exercise',group:g};if(a==='editExercise')modal={type:'exercise',group:g,id,item:groupBy(g).items.find(x=>x.id===id)};if(a==='addRecord')modal={type:'record',group:g,id};if(a==='editRecord')modal={type:'record',group:g,id,record:itemBy({group:g,id}).records.find(r=>r.id===el.dataset.record)};if(a==='addDayExercise')modal={type:'day',day};if(a==='editDayExercise')modal={type:'day',day,id,item:state.days[day].find(e=>e.id===id)};if(a==='close')modal=null;if(a==='deleteGroup'){let group=groupBy(g);if(confirm('Удалить секцию «'+group.name+'» и всю её историю?')){state.groups=state.groups.filter(x=>x.id!==g);update();return}}if(a==='removeModal'){let m=modal;if(!confirm(m.type==='record'?'Удалить запись?':'Удалить упражнение?'))return;if(m.type==='record')itemBy(m).records=itemBy(m).records.filter(x=>x.id!==m.record.id);if(m.type==='exercise')groupBy(m.group).items=groupBy(m.group).items.filter(x=>x.id!==m.id);if(m.type==='day'){state.days[m.day]=state.days[m.day].filter(x=>x.id!==m.id);state.done[m.day]=state.done[m.day].filter(x=>x!==m.id)}modal=null;}if(a==='export'){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='gym-backup-'+new Date().toISOString().slice(0,10)+'.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);return}if(a==='import'){document.getElementById('importFile').click();return}update();});
