document.addEventListener('click',ev=>{if(ev.target.matches('dialog.modal')){modal=null;update();return}const el=ev.target.closest('[data-action]');if(!el)return;let a=el.dataset.action,id=el.dataset.id,day=el.dataset.day,g=el.dataset.group;if(['openWorkout','openWorkoutExercise','workoutBack','startWorkoutExercise','addSet','removeSet','toggleAlternatives','selectWorkoutVariant','addAlternative'].includes(a))return; if(a==='clearSearch'){let inp=document.getElementById('wsearch');clearTimeout(wt);wq='';inp.value='';el.hidden=true;document.getElementById('wlist').innerHTML=groupsHtml();inp.focus();return}if(a==='newChat'){if(!chatBusy){chat=[];drawChat()}return}if(a==='toggleChart'){openCharts.has(id)?openCharts.delete(id):openCharts.add(id);el.closest('.item-card').classList.toggle('open',openCharts.has(id));el.setAttribute('aria-expanded',openCharts.has(id));return}if(a==='today'){state.today=state.today===id?null:id;update();return}if(a==='tab'){exerciseId=null;if(id==='day')id='workouts';if(DAYS.includes(id))state.lastDay=id;state.tab=id;modal=null;update();document.getElementById('app').scrollTop=0;return}if(a==='done'){toggleWorkoutDone(day,id);return}if(a==='finish'){finishWorkout(day);return}if(a==='reset'){if(confirm('Сбросить выполненные упражнения дня '+(day==='star'?'★':day)+'?')){state.done[day]=[];if(state.sessions)state.sessions[day]={};update()}return}if(a==='addGroup')modal={type:'group'};if(a==='addExercise')modal={type:'exercise',group:g};if(a==='editExercise')modal={type:'exercise',group:g,id,item:groupBy(g).items.find(x=>x.id===id)};if(a==='addRecord')modal={type:'record',group:g,id};if(a==='editRecord')modal={type:'record',group:g,id,record:itemBy({group:g,id}).records.find(r=>r.id===el.dataset.record)};if(a==='addDayExercise')modal={type:'day',day};if(a==='editDayExercise')modal={type:'day',day,id,item:workoutExerciseById(day,id)};if(a==='close')modal=null;if(a==='deleteGroup'){let group=groupBy(g);if(confirm('Удалить секцию «'+group.name+'» и всю её историю?')){state.groups=state.groups.filter(x=>x.id!==g);update();return}}if(a==='removeModal'){let m=modal;if(!confirm(m.type==='record'?'Удалить запись?':'Удалить упражнение?'))return;if(m.type==='record')itemBy(m).records=itemBy(m).records.filter(x=>x.id!==m.record.id);if(m.type==='exercise')groupBy(m.group).items=groupBy(m.group).items.filter(x=>x.id!==m.id);if(m.type==='day')removeWorkoutExercise(m.day,m.id);modal=null;}if(a==='export'){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='gym-backup-'+new Date().toISOString().slice(0,10)+'.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);return}if(a==='import'){document.getElementById('importFile').click();return}update();});
document.addEventListener('submit',ev=>{if(ev.target.id!=='editForm')return;ev.preventDefault();let m=modal,f=new FormData(ev.target),name=String(f.get('name')||'').trim();if(m.type==='group'){if(!name)return alert('Введите название');state.groups.push({id:uid(),name,items:[]})}if(m.type==='exercise'){if(!name)return alert('Введите название');if(m.item)m.item.name=name;else groupBy(m.group).items.push({id:uid(),name,records:[]})}if(m.type==='record'){let w=Number(String(f.get('weight')||'').replace(',','.'));if(!f.get('weight')||!Number.isFinite(w)||w<=0)return alert('Укажите положительный вес');let s=String(f.get('reps')||'').trim();let data={weight:w,reps:s===''?null:s,date:String(f.get('date')||'')||null,up:f.has('up')};if(m.record)Object.assign(m.record,data);else itemBy(m).records.push({id:uid(),...data})}if(m.type==='day'){if(!name)return alert('Введите название');let s=Number(f.get('sets'));if(!Number.isInteger(s)||s<1)return alert('Подходы должны быть целым числом');let data={name,sets:s,range:String(f.get('range')||'').trim(),weightId:String(f.get('weightId')||'')||null};if(m.item)Object.assign(m.item,data);else if(m.parentId){const parent=parentExercise(m.day,m.parentId);parent.alternatives||=[];parent.alternatives.push({id:uid(),...data});expandedExercises.add(m.day+':'+m.parentId)}else state.days[m.day].push({id:uid(),...data})}modal=null;update();});
document.getElementById('importFile').addEventListener('change',async ev=>{let file=ev.target.files?.[0];if(!file)return;try{let d=JSON.parse(await file.text());if(!d.days||!d.groups||!d.done||!Array.isArray(d.groups))throw Error('Неверный формат');if(confirm('Заменить текущие данные импортированной копией?')){state=prepareHistory(d);exerciseId=null;modal=null;update()}}catch(e){alert('Импорт не удался: '+e.message)}ev.target.value=''});
onVV();render();save();

  window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js',{scope:'./'}).catch(err=>console.warn('Offline cache unavailable:',err)));
